[package]
name = "consent-registry"
version = "0.1.0"
description = "Consentinel: user-owned, revocable likeness-consent records (one PDA per HTN badge)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "consent_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
solana-instructions-sysvar = "3.0.1"
solana-sdk-ids = "3.1.0"
solana-sha256-hasher = "3.1.0"

