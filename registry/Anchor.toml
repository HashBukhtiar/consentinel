[toolchain]
anchor_version = "1.2.0"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
consent_registry = "UKoViTT9288nMeBzjeMoHBBmxHfXvbg6F1gF6pjiSW7"

[programs.devnet]
consent_registry = "UKoViTT9288nMeBzjeMoHBBmxHfXvbg6F1gF6pjiSW7"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test.validator]
# quiet local validator for `anchor test`
ledger = ".anchor/test-ledger"
